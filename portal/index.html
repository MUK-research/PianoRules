<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PianoRules · interactive sketch</title><style>
:root{color-scheme:dark;font:12px Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#141b16;color:#edf3e8;padding:17px}header,footer,.choices{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}header{font:9px monospace;letter-spacing:1px;color:#b6c2b0}canvas{width:100%;height:176px;display:block}button{font:11px Arial,sans-serif;padding:8px 11px;border:1px solid #475744;border-radius:4px;background:transparent;color:#c7d1c2;cursor:pointer}button[aria-pressed=true]{background:#c2ebaa;color:#122110;border-color:#c2ebaa}button:focus-visible{outline:2px solid #70bfff;outline-offset:3px}.choices{justify-content:flex-start}#mode{margin-left:auto}code{display:block;margin:12px 0 4px;color:#bde8a5;font:10px/1.6 monospace}footer{margin-top:10px;font-size:10px;color:#a8b5a2}p{margin:0}#chord-label{color:#c2ebaa}
</style></head><body><header><span>PIANORULES / HARMONIC MEMORY</span><span>SILENT SKETCH</span></header><canvas aria-label="Illustration of generated note patterns" role="img"></canvas><div class="choices" role="group" aria-label="Choose a harmonic source"><button type="button" data-chord="0" aria-pressed="true">Cmaj7</button><button type="button" data-chord="1" aria-pressed="false">Dm7</button><button type="button" data-chord="2" aria-pressed="false">G7</button><button id="mode" type="button">Mode: cloud ↻</button></div><code>while harmony exists every 75ms:<br>&nbsp; play random note from harmony</code><footer><p id="chord-label" role="status">C · E · G · B</p><span>Illustration, not the MIDI engine. No sound.</span></footer><script>
// Self-contained: no imports, storage, permissions or connection to a MIDI instrument.
const q=new URLSearchParams(location.search),token=q.get('prlToken'),canvas=document.querySelector('canvas'),g=canvas.getContext('2d');
const chords=[[60,64,67,71],[62,65,69,72],[55,59,62,65]],names=['C · E · G · B','D · F · A · C','G · B · D · F'];
let chord=0,mode=0,w=300,phase=0,raf=0,last=0,active=q.get('motion')!=='off'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){if(!g)return;g.clearRect(0,0,w,176);g.strokeStyle='#c2ebaa12';for(let i=0;i<8;i++){g.beginPath();g.moveTo(8,20+i*18);g.lineTo(w-8,20+i*18);g.stroke();}const notes=chords[chord];
 for(let i=0;i<48;i++){const n=notes[mode?i%4:(i*7+Math.floor(i/3))%4]+(mode?0:(i%3-1)*12),x=10+((i*29-phase*30)%(w-35)+(w-35))%(w-35),y=151-(n-43)*3.1;g.fillStyle=mode?'#c2ebaa':i%3===0?'#70bfff':'#c2ebaa';g.globalAlpha=.2+.65*(x/w);g.fillRect(x,y,mode?20:7+i%4*3,3);}
 g.globalAlpha=1;g.strokeStyle='#ff5768aa';g.beginPath();g.moveTo(w*.72,10);g.lineTo(w*.72,165);g.stroke();for(let i=0;i<4;i++){g.fillStyle='#ff8792';g.fillRect(w*.72-3,151-(notes[i]-43)*3.1,6,4);}}
function frame(t){raf=0;if(!active||document.hidden)return;if(t-last>33){phase+=Math.min(t-last,80)/1000;last=t;draw();}raf=requestAnimationFrame(frame);}
function sync(){cancelAnimationFrame(raf);raf=0;draw();if(active&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
new ResizeObserver(()=>{w=canvas.clientWidth;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*d);canvas.height=Math.round(176*d);if(g)g.setTransform(d,0,0,d,0,0);draw();parent.postMessage({type:'prl:resize',token,height:document.body.scrollHeight},'*');}).observe(canvas);
document.querySelectorAll('[data-chord]').forEach(b=>b.addEventListener('click',()=>{chord=Number(b.dataset.chord);document.querySelectorAll('[data-chord]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#chord-label').textContent=names[chord];phase+=.6;draw();}));
document.querySelector('#mode').addEventListener('click',e=>{mode=1-mode;e.target.textContent=mode?'Mode: ostinato ↻':'Mode: cloud ↻';document.querySelector('code').textContent=mode?'while harmony exists every 240ms: play next note from harmony':'while harmony exists every 75ms: play random note from harmony';draw();});
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.token===token&&e.data.type==='prl:visibility'){active=Boolean(e.data.active);sync();}});document.addEventListener('visibilitychange',sync);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));sync();parent.postMessage({type:'prl:ready',token},'*');
</script></body></html>
